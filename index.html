<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokemonSearch</title>
    <script src="pokeList.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="image\logo.jpg" class="logo">
        </a>
        <a href="index.html" class="pc">
            <img src="image\update.jpg" class="update">
        </a>
    </header>
    <main>
        <div class="show-container" id="show-container">
            <div class="scroll-track">
                <div class="card">
                    <div class="name1"></div>
                    <div class="img1"></div>
                </div>
                <div class="card">
                    <div class="name2"></div>
                    <div class="img2"></div>
                </div>
                <div class="card">
                    <div class="name3"></div>
                    <div class="img3"></div>
                </div>
                <div class="card">
                    <div class="name4"></div>
                    <div class="img4"></div>
                </div>
                <div class="card">
                    <div class="name5"></div>
                    <div class="img5"></div>
                </div>
                <div class="card">
                    <div class="name6"></div>
                    <div class="img6"></div>
                </div>
                <div class="card">
                    <div class="name7"></div>
                    <div class="img7"></div>
                </div>
                <div class="card">
                    <div class="name8"></div>
                    <div class="img8"></div>
                </div>

                <div class="card">
                    <div class="name1"></div>
                    <div class="img1"></div>
                </div>
                <div class="card">
                    <div class="name2"></div>
                    <div class="img2"></div>
                </div>
                <div class="card">
                    <div class="name3"></div>
                    <div class="img3"></div>
                </div>
                <div class="card">
                    <div class="name4"></div>
                    <div class="img4"></div>
                </div>
                <div class="card">
                    <div class="name5"></div>
                    <div class="img5"></div>
                </div>
                <div class="card">
                    <div class="name6"></div>
                    <div class="img6"></div>
                </div>
                <div class="card">
                    <div class="name7"></div>
                    <div class="img7"></div>
                </div>
                <div class="card">
                    <div class="name8"></div>
                    <div class="img8"></div>
                </div>
            </div>
        </div>
        <h2 class="pc">ポケモンを検索！</h2>
        <h2 class="ph">図鑑番号で検索</h2>
        <div class="search-container" id="search-container">
            <input type="text" id="inputId" placeholder="名前や図鑑番号で探す">
            <button id="search">検索</button>
        </div>
    </main>

    <!-- 検索結果表示エリア -->
    <div class="result-page" id="result-page" style="display: none;">
        <button id="close-btn" class="close-btn">✕</button>

        <div class="result-container" id="result-container">

            <div class="detail-container" id="detail-container">
                <div class="detail-name" id="detail-name"></div>
                <div class="type-container" id="type-container">
                    <div>
                        <p class="aaa" style="display: block;">タイプ：</p>
                    </div>
                    <div class="type-show" id="type-show"></div>
                </div>
                <div class="detail-height" id="detail-height"></div>
                <div class="detail-weight" id="detail-weight"></div>
                <div class="detail-voice" id="detail-voice"></div>
            </div>

            <div class="detail-image" id="detail-image"></div>
        </div>
    </div>
